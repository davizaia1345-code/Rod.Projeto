<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | RodBarber</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rod.css">
    <link rel="icon" type="image/png" href="https://i.ibb.co/8DXKQy0T/IMG-5529.png">
</head>
<body class="auth-page">

    <div class="register-container">
        <a href="/" class="logo"><span>/</span> RodBarber</a>

        <h2>Crie sua conta</h2>
        <p class="auth-subtitle">Leva menos de um minuto.</p>

        <form id="form-cadastro">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>
            </div>

            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" autocomplete="new-password" minlength="8" maxlength="72" required>
                <small style="color: var(--text-faint); font-size: 0.75rem; display: block; margin-top: 5px;">Mínimo de 8 caracteres</small>
            </div>

            <button type="submit"><i class="fas fa-user-plus"></i> Cadastrar</button>
        </form>

        <p id="mensagem"></p>

        <div class="footer-links">
            <p>Já tem conta? <a href="/login">Faça login</a></p>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO LOCAL ---
        const API_URL = 'https://rodbarber-api-0jna.onrender.com';
        
        const form = document.getElementById('form-cadastro');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = form.querySelector('button');

            btn.disabled = true;
            btn.innerText = "Criando...";
            mensagem.innerText = "";

            try {
                // Requisição Local
                const response = await fetch(`${API_URL}/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    mensagem.style.color = '#25d366'; // Verde
                    mensagem.innerText = "Cadastro realizado! Indo para o login...";
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    mensagem.style.color = '#ff4d4d'; // Vermelho
                    mensagem.innerText = data.erro || "Erro ao cadastrar.";
                    btn.disabled = false;
                    btn.innerText = "CADASTRAR";
                }
            } catch (error) {
                console.error("Erro de conexão:", error);
                mensagem.style.color = '#ff4d4d';
                mensagem.innerText = "Erro de conexão com o servidor.";
                btn.disabled = false;
                btn.innerText = "CADASTRAR";
            }
        });
    </script>

</body>
</html>
