<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | RodBarber</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rod.css">
    <link rel="icon" type="image/png" href="https://i.ibb.co/8DXKQy0T/IMG-5529.png">
</head>
<body class="auth-page">
    <div class="container">
        <a href="/" class="logo"><span>/</span> RodBarber</a>
        <h2>Recuperar Senha</h2>
        <p class="auth-subtitle">Digite seu e-mail para receber o link de redefinição.</p>

        <div class="input-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
        </div>
        <button onclick="enviarEmail()"><i class="fas fa-paper-plane"></i> Enviar Link</button>

        <p id="mensagem"></p>
        <a href="/login" class="back-link">← Voltar ao Login</a>
    </div>

    <script>
        // Configuração Local
        const API_URL = 'https://rodbarber-api-0jna.onrender.com';

        async function enviarEmail() {
            const email = document.getElementById('email').value;
            const msg = document.getElementById('mensagem');
            const btn = document.querySelector('button');

            if(!email) {
                msg.innerText = "Por favor, digite seu e-mail.";
                msg.style.color = '#ff4d4d';
                return;
            }

            btn.disabled = true; btn.innerText = "Enviando...";
            msg.innerText = "";

            try {
                const response = await fetch(`${API_URL}/esqueci-senha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                
                if (response.ok) {
                    msg.innerText = data.mensagem || "Se o e-mail estiver cadastrado, você receberá o link.";
                    msg.style.color = '#25d366';
                } else {
                    msg.innerText = data.erro || "Erro ao enviar.";
                    msg.style.color = '#ff4d4d';
                }
            } catch (e) {
                msg.innerText = "Erro ao conectar com o servidor.";
                msg.style.color = '#ff4d4d';
            }
            btn.disabled = false; btn.innerText = "ENVIAR LINK";
        }
    </script>
</body>
</html>
