<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | RodBarber</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0908">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://rodbarber-api-0jna.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rod.css">
</head>
<body class="auth-page">
    <main class="container">
        <a href="/" class="logo"><span>/</span> RodBarber</a>
        <h1>Recuperar senha</h1>
        <p class="auth-subtitle">Digite seu e-mail para receber o link de redefinição.</p>

        <form id="form-esqueci" novalidate>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
            </div>
            <button type="submit"><i class="fas fa-paper-plane"></i> Enviar link</button>
        </form>

        <p id="mensagem" role="alert" aria-live="polite"></p>
        <div id="dica-spam" class="dica-caixa" hidden><i class="far fa-envelope"></i> Não chegou? Confira a caixa de spam ou lixo eletrônico. O link vale por tempo limitado.</div>
        <a href="/login" class="back-link"><i class="fas fa-arrow-left"></i> Voltar ao login</a>
    </main>

    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>
    <script>
        (function () {
            var API_URL = 'https://rodbarber-api-0jna.onrender.com';
            RodUI.aquecer(API_URL);
            var form = document.getElementById('form-esqueci'), msg = document.getElementById('mensagem'), email = document.getElementById('email');
            email.focus();
            var ultimoEnvio = 0;

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                var btn = form.querySelector('button[type="submit"]');
                var em = email.value.trim().toLowerCase();
                if (!em) { RodUI.mensagem(msg, 'erro', 'Por favor, digite seu e-mail.'); email.focus(); return; }
                if (!/^\S+@\S+\.\S+$/.test(em)) { RodUI.mensagem(msg, 'erro', 'Esse e-mail não parece válido.'); email.focus(); return; }
                if (Date.now() - ultimoEnvio < 30000) { RodUI.mensagem(msg, 'info', 'Aguarde alguns segundos antes de pedir outro link.'); return; }

                RodUI.carregando(btn, true, 'Enviando...');
                RodUI.mensagem(msg, '', '');
                try {
                    var response = await fetch(API_URL + '/esqueci-senha', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: em }) });
                    var data = await response.json().catch(function () { return {}; });
                    if (response.ok) {
                        ultimoEnvio = Date.now();
                        RodUI.mensagem(msg, 'ok', data.mensagem || 'Se o e-mail estiver cadastrado, você receberá o link.');
                        document.getElementById('dica-spam').hidden = false;
                    } else {
                        RodUI.mensagem(msg, 'erro', data.erro || 'Não foi possível enviar agora.');
                    }
                } catch (err) {
                    RodUI.mensagem(msg, 'erro', 'Sem conexão com o servidor. Tente de novo.');
                }
                RodUI.carregando(btn, false);
            });
        })();
    </script>
</body>
</html>
