<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RodBarber</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rod.css">
    <link rel="icon" type="image/png" href="https://i.ibb.co/8DXKQy0T/IMG-5529.png">
</head>
<body class="auth-page">

    <div class="login-container">
        <a href="/" class="logo"><span>/</span> RodBarber</a>

        <h2>Acesse sua conta</h2>
        <p class="auth-subtitle">Entre para agendar seu próximo horário.</p>

        <form id="form-login">
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="********" autocomplete="current-password" required>
            </div>

            <a href="/esqueci-senha" class="forgot-link">Esqueci a senha</a>

            <button type="submit"><i class="fas fa-right-to-bracket"></i> Entrar</button>
        </form>

        <p id="mensagem"></p>

        <div class="footer-links">
            <p>Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p>
            <a href="/" class="back-link">← Voltar ao site</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://rodbarber-api-0jna.onrender.com';
        
        const form = document.getElementById('form-login');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = form.querySelector('button');

            btn.disabled = true;
            btn.innerText = "Carregando...";
            mensagem.innerText = "";

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (response.ok) {
                    mensagem.style.color = '#25d366'; // Verde
                    mensagem.innerText = "Login realizado! Redirecionando...";
                    
                    // Salva os dados
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuarioNome', data.usuario.nome);
                    localStorage.setItem('usuarioEmail', data.usuario.email);

                    // O dono vai direto para o painel dele; clientes vão para o site
                    const destino = data.usuario.dono ? '/admin' : '/';

                    setTimeout(() => {
                        window.location.href = destino;
                    }, 1200);

                } else {
                    mensagem.style.color = '#ff4d4d'; // Vermelho
                    mensagem.innerText = data.erro || "Erro ao entrar.";
                    btn.disabled = false;
                    btn.innerText = "ENTRAR";
                }
            } catch (error) {
                mensagem.style.color = '#ff4d4d';
                mensagem.innerText = "Erro de conexão com o servidor.";
                btn.disabled = false;
                btn.innerText = "ENTRAR";
            }
        });
    </script>

</body>
</html>
