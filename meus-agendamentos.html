<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Cortes | RodBarber</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0908">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rod.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.22.0/dist/sweetalert2.all.min.js" integrity="sha384-rHxJuSO4eAGYnLjV2BLfndcudTiVBpNRJsOOLMtkX48TMZ5lefUhbpBJ6t8u/3nH" crossorigin="anonymous"></script>
</head>
<body class="dashboard-page">

<main class="dashboard-container">
    <div class="page-header">
        <h1 class="page-title"><i class="fas fa-calendar-check"></i> Meus Cortes</h1>
        <div class="page-header-acoes">
            <a href="/#agendamento" class="btn-novo"><i class="far fa-calendar-plus"></i> Novo agendamento</a>
            <a href="/" class="btn-voltar"><i class="fas fa-arrow-left"></i> Início</a>
        </div>
    </div>
    <p class="ola" id="ola"></p>
    <div id="lista-agendamentos" aria-live="polite">
        <div class="skel-card skel"></div>
        <div class="skel-card skel"></div>
    </div>
    <footer class="conta-rodape">
        <button type="button" class="btn-excluir-conta" id="btn-excluir-conta"><i class="far fa-trash-can"></i> Excluir minha conta</button>
        <a href="/privacidade" class="link-discreto">Política de Privacidade</a>
    </footer>
</main>

<div id="modal-pix" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-pix-titulo">
    <div class="modal-content">
        <button type="button" class="modal-fechar" data-click="fecharModal" aria-label="Fechar"><i class="fas fa-xmark"></i></button>
        <h3 id="modal-pix-titulo" class="modal-titulo"><i class="fa-brands fa-pix"></i> Pagamento PIX</h3>
        <p class="modal-sub">Escaneie o QR Code ou copie o código abaixo.</p>

        <img id="qr-image" src="" alt="QR Code PIX" class="pix-img" width="190" height="190">

        <textarea id="pix-text" class="pix-textarea" rows="4" readonly aria-label="Código PIX copia e cola"></textarea>

        <button type="button" data-click="copiarPix" class="btn-pagar" style="width:100%; justify-content:center; margin-bottom:15px;">
            <i class="fas fa-copy"></i> COPIAR CÓDIGO
        </button>

        <div id="status-verificacao" class="modal-status">
            <span class="pix-pulse"></span> Aguardando confirmação do pagamento...
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script src="util.js"></script>
<script src="js/acoes.js"></script>
<script src="js/meus-agendamentos.js"></script>
</body>
</html>
