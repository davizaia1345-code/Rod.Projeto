<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Cortes - RodBarber</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rod.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.22.0/dist/sweetalert2.all.min.js" integrity="sha384-rHxJuSO4eAGYnLjV2BLfndcudTiVBpNRJsOOLMtkX48TMZ5lefUhbpBJ6t8u/3nH" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="https://i.ibb.co/8DXKQy0T/IMG-5529.png">
</head>
<body class="dashboard-page">

<div class="dashboard-container">
    <div class="page-header">
        <div class="page-title"><i class="fas fa-calendar-check"></i> Meus Cortes</div>
        <a href="/" class="btn-voltar"><i class="fas fa-arrow-left"></i> Voltar ao Início</a>
    </div>
    <div id="lista-agendamentos">
        <div class="loading-state">
            <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Buscando seus horários...
        </div>
    </div>
</div>

<div id="modal-pix" class="modal-overlay">
    <div class="modal-content">
        <span style="cursor:pointer; float:right; color:#888; font-size: 1.5rem;" onclick="fecharModal()" role="button" tabindex="0" aria-label="Fechar">&times;</span>
        <h3 style="color:#fff; text-transform: uppercase;">Pagamento PIX</h3>
        <p style="color:#888; font-size: 0.9rem;">Escaneie ou copie o código abaixo</p>
        
        <img id="qr-image" src="" class="pix-img">
        
        <textarea id="pix-text" class="pix-textarea" readonly></textarea>
        
        <button onclick="copiarPix()" class="btn-pagar" style="width:100%; justify-content:center; margin-bottom:15px;">
            <i class="fas fa-copy"></i> COPIAR CÓDIGO
        </button>
        
        <div id="status-verificacao" style="color:#d4af37; font-size:0.9rem; font-weight: bold;">
            <i class="fas fa-spinner fa-spin"></i> Aguardando confirmação...
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script>
    // --- CONFIGURAÇÃO LOCAL ---
    const API_URL = 'https://rodbarber-api-0jna.onrender.com';
    let intervaloVerificacao = null;

    function formatarData(dataISO) {
        if (!dataISO) return '--/--/----';
        const p = dataISO.split('-'); return `${p[2]}/${p[1]}/${p[0]}`;
    }

    async function carregarAgendamentos() {
        if (!RodAuth.token()) { window.location.href = '/login'; return; }
        if (RodAuth.papel() === 'owner') { window.location.replace('/admin'); return; }
        
        const container = document.getElementById('lista-agendamentos');
        
        try {
            const res = await RodAuth.fetch(`${API_URL}/meus-agendamentos`);
            if (!res.ok) throw new Error("falha");
            const lista = await res.json();
            
            container.innerHTML = '';
            
            if (lista.length === 0) {
                container.innerHTML = `
                    <div class="loading-state">
                        <i class="far fa-calendar-times fa-3x" style="margin-bottom:15px; opacity:0.5;"></i>
                        <br>Nenhum agendamento encontrado.
                    </div>`;
                return;
            }
            
            lista.reverse().forEach(item => {
                const pago = item.statusPagamento === 'approved';
                const card = document.createElement('div');
                card.className = 'agendamento-card';
                
                // HTML DO CARD
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-date"><i class="far fa-calendar-alt"></i> ${formatarData(item.data)} às ${RodAuth.esc(item.hora)}</span>
                        <span class="card-service">${RodAuth.esc(item.servico)}</span>
                        <span style="color:#888; font-size:0.95rem;">Valor: R$ ${Number(item.valor) || 0},00</span>
                        ${!pago && item.pagarAte ? `<span class="pagar-ate"><i class="far fa-hourglass-half"></i> Pague até ${RodAuth.esc(new Date(item.pagarAte).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(', ', ' às '))} ou a vaga é liberada</span>` : ''}
                    </div>
                    <div class="card-actions">
                        <span class="status-badge ${pago ? 'status-pago' : 'status-pendente'}">${pago ? 'PAGO' : 'PENDENTE'}</span>
                        
                        ${!pago && item.pixCopiaCola ? `
                            <button class="btn-pagar" onclick='abrirModal("${RodAuth.esc(item.qrCodeBase64)}", "${RodAuth.esc(item.pixCopiaCola)}", "${RodAuth.esc(item.pagamentoId)}")'>
                                <i class="fa-brands fa-pix"></i> PIX
                            </button>` : ''
                        }
                        
                        ${!pago && /^https:\/\//.test(item.urlPagamentoCartao || "") ? `
                            <a href="${RodAuth.esc(item.urlPagamentoCartao)}" target="_blank" rel="noopener noreferrer" class="btn-card">
                                <i class="far fa-credit-card"></i> CARTÃO
                            </a>` : ''
                        }
                        
                        <button class="btn-cancelar" onclick="cancelar('${RodAuth.esc(item._id)}')" title="Cancelar Agendamento" aria-label="Cancelar agendamento">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>`;
                container.appendChild(card);
            });
        } catch (e) { 
            console.error(e);
            container.innerHTML = '<p style="color:#e62e2e">Erro ao conectar com o servidor.</p>'; 
        }
    }

    // --- FUNÇÕES DO MODAL DE PAGAMENTO ---
    function abrirModal(base64, copiaCola, id) {
        document.getElementById('qr-image').src = `data:image/jpeg;base64,${base64}`;
        document.getElementById('pix-text').value = copiaCola;
        document.getElementById('modal-pix').style.display = 'flex';
        iniciarVerificacao(id);
    }

    function fecharModal() { 
        document.getElementById('modal-pix').style.display = 'none'; 
        clearInterval(intervaloVerificacao); 
    }

    function copiarPix() {
        const t = document.getElementById('pix-text'); 
        t.select(); 
        navigator.clipboard.writeText(t.value);
        Swal.fire({ 
            toast: true, position: 'top', icon: 'success', 
            title: 'Código Copiado!', showConfirmButton: false, 
            timer: 1500, background: '#333', color: '#fff' 
        });
    }

    function iniciarVerificacao(id) {
        clearInterval(intervaloVerificacao);
        intervaloVerificacao = setInterval(async () => {
            try {
                const res = await RodAuth.fetch(`${API_URL}/status-pagamento/${id}`);
                const data = await res.json();
                if (data.status === 'approved') {
                    clearInterval(intervaloVerificacao);
                    Swal.fire({ 
                        icon: 'success', title: 'Pagamento Confirmado!', 
                        text: 'Seu horário está garantido.', 
                        background: '#1a1a1a', color: '#fff', confirmButtonColor: '#25d366'
                    });
                    fecharModal(); 
                    carregarAgendamentos(); // Recarrega a lista para mostrar "PAGO"
                }
            } catch (e) {}
        }, 3000); 
    }

    async function cancelar(id) {
        const result = await Swal.fire({
            title: 'Cancelar horário?',
            text: "Essa vaga será liberada para outros clientes.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e62e2e',
            cancelButtonColor: '#333',
            confirmButtonText: 'Sim, cancelar',
            background: '#1a1a1a',
            color: '#fff'
        });
        
        if (result.isConfirmed) {
            try {
                const resp = await RodAuth.fetch(`${API_URL}/agendamentos/${id}`, { method: 'DELETE' });
                if (!resp.ok) throw new Error('falha');
                Swal.fire({ 
                    title: 'Cancelado!', icon: 'success', 
                    background: '#1a1a1a', color: '#fff', 
                    timer: 1500, showConfirmButton: false 
                });
                carregarAgendamentos();
            } catch (e) { 
                Swal.fire('Erro', 'Não foi possível cancelar.', 'error'); 
            }
        }
    }
    
    document.addEventListener('DOMContentLoaded', carregarAgendamentos);
</script>
</body>
</html>
