<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha | RodBarber</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rod.css">
    <link rel="icon" type="image/png" href="https://i.ibb.co/8DXKQy0T/IMG-5529.png">
</head>
<body class="auth-page">
    <div class="container">
        <a href="/" class="logo"><span>/</span> RodBarber</a>
        <h2>Criar Nova Senha</h2>
        <p class="auth-subtitle">Digite sua nova senha abaixo.</p>

        <div class="input-group">
            <label>Nova senha</label>
            <input type="password" id="novaSenha" placeholder="••••••••" autocomplete="new-password" minlength="6">
        </div>
        <button onclick="mudarSenha()"><i class="fas fa-key"></i> Salvar Senha</button>

        <p id="mensagem"></p>
    </div>

    <script>
        // --- CONFIGURAÇÃO DO SERVIDOR LOCAL ---
        
        const API_URL = 'https://rodbarber-api-0jna.onrender.com';

        async function mudarSenha() {
            // Pega o token que veio no link do e-mail
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            
            const novaSenha = document.getElementById('novaSenha').value;
            const msg = document.getElementById('mensagem');
            const btn = document.querySelector('button');
            
            if(!token) {
                msg.innerText = "Link inválido ou expirado. Tente pedir outro.";
                msg.style.color = '#ff4d4d';
                return;
            }
            if(!novaSenha) return alert("Digite a nova senha");

            btn.disabled = true; 
            btn.innerText = "Salvando...";

            try {
                // Envia a nova senha para o servidor local
                const response = await fetch(`${API_URL}/resetar-senha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, novaSenha })
                });
                const data = await response.json();

                if(response.ok) {
                    msg.style.color = '#25d366';
                    msg.innerText = "Senha alterada com sucesso! Redirecionando...";
                    setTimeout(() => window.location.href = '/login', 3000);
                } else {
                    msg.style.color = '#ff4d4d';
                    msg.innerText = data.erro || "Erro ao alterar senha.";
                    btn.disabled = false; 
                    btn.innerText = "SALVAR SENHA";
                }
            } catch (e) {
                console.error("Erro de conexão:", e);
                msg.innerText = "Erro ao conectar com o servidor.";
                msg.style.color = '#ff4d4d';
                btn.disabled = false; 
                btn.innerText = "SALVAR SENHA";
            }
        }
    </script>
</body>
</html>
