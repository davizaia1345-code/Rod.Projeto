<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha | RodBarber</title>
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0a0908">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha384-3B6NwesSXE7YJlcLI9RpRqGf2p/EgVH8BgoKTaUrmKNDkHPStTQ3EyoYjCGXaOTS" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://rodbarber-api-0jna.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rod.css">
</head>
<body class="auth-page">
    <main class="container">
        <a href="/" class="logo"><span>/</span> RodBarber</a>
        <h1>Criar nova senha</h1>
        <p class="auth-subtitle">Digite sua nova senha abaixo.</p>

        <form id="form-reset" novalidate>
            <div class="input-group">
                <label for="novaSenha">Nova senha</label>
                <input type="password" id="novaSenha" placeholder="Pelo menos 8 caracteres" autocomplete="new-password" maxlength="72" required>
            </div>
            <div class="input-group">
                <label for="confirmar">Repita a senha</label>
                <input type="password" id="confirmar" placeholder="Repita a nova senha" autocomplete="new-password" maxlength="72" required>
            </div>
            <button type="submit"><i class="fas fa-key"></i> Salvar senha</button>
        </form>

        <p id="mensagem" role="alert" aria-live="polite"></p>
        <a href="/esqueci-senha" class="back-link" id="link-novo" hidden>Pedir um novo link</a>
    </main>

    <script src="auth.js"></script>
    <script src="auth-ui.js"></script>
    <script src="js/acoes.js"></script>
<script src="js/resetar-senha.js"></script>
</body>
</html>
